name: Build Plugin
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Plugin
        run: ./gradlew :plugins:MyFirstJavaPlugin:make
      - uses: actions/upload-artifact@v4
        with:
          name: Mp3VoiceMessage
          path: plugins/MyFirstJavaPlugin/build/outputs/
